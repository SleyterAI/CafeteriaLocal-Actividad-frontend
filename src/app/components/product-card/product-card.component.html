<article class="product-card"
[routerLink]="['/productos', producto().id]">

  <img [src]="producto().imageUrl" [alt]="producto().nombre" />

  <div class="product-info">
    <span class="category">
      {{ producto().categoria.nombre }}
    </span>

    <h4>{{ producto().nombre }}</h4>

    <strong>S/ {{ producto().precio }}
    </strong>

    @if (producto().stock > 0) {
    <strong><span class="stock">DISPONIBLE</span></strong>
    } @else {
    <strong><span class="out-of-stock">AGOTADO</span></strong>
    }
    <button class="btn btn-brown"(click)="agregarAlCarrito();
    $event.stopPropagation()" [disabled]="producto().stock <= 0">
      Agregar
    </button>
  </div>

</article>
