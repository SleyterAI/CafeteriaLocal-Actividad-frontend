<div class="search-container">

  <span class="search-icon">
    🔍
  </span>

  <select class="search-select">

    <option value="">
      Seleccionar categoría
    </option>

    @for (categoria of categorias(); track categoria.id) {
      <option [value]="categoria.id">
        {{ categoria.nombre }}
      </option>
    }

  </select>

</div>
